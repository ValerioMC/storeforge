name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            tag="v${REQUESTED_VERSION#v}"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]]
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "StoreForge $version" --generate-notes
          fi
          printf 'tag=%s\nnumber=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            folder: dmg
            format: dmg
            asset: StoreForge-macOS-arm64.dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: dmg
            folder: dmg
            format: dmg
            asset: StoreForge-macOS-x64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            folder: nsis
            format: exe
            asset: StoreForge-Windows-x64-setup.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            folder: deb
            format: deb
            asset: StoreForge-Linux-x64.deb
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.number }}
      RUST_TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf xdg-utils
      - shell: bash
        run: |
          rustup toolchain install
          rustup target add "$RUST_TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - shell: bash
        run: node scripts/set-version.mjs "$RELEASE_VERSION"
      - run: npm ci
      - shell: bash
        run: npm run tauri -- build --target "$RUST_TARGET" --bundles "$BUNDLES" -- --locked
      - shell: bash
        env:
          BUNDLE_FOLDER: ${{ matrix.folder }}
          ASSET_FORMAT: ${{ matrix.format }}
          ASSET_NAME: ${{ matrix.asset }}
        run: scripts/package-release.sh "src-tauri/target/$RUST_TARGET/release/bundle/$BUNDLE_FOLDER" "$ASSET_FORMAT" "$ASSET_NAME"
      - if: runner.os == 'Linux'
        shell: bash
        run: scripts/package-release.sh "src-tauri/target/$RUST_TARGET/release/bundle/appimage" AppImage StoreForge-Linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: upload/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: upload
          merge-multiple: true
      - shell: bash
        run: |
          set -euo pipefail
          cd upload
          sha256sum StoreForge-* > SHA256SUMS
          gh release upload "$RELEASE_TAG" StoreForge-* SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
